<style>
/* Conceito: livro de capa azul-marinho com filetes dourados. Cartões quadrados em grade, tipografia da marca (sans forte + serifa em caixa alta). Visual escuro por escolha, igual à arte do canal. */
:root{
  /* Tema claro (padrão): bege envelhecido, ouro envelhecido e azul-marinho */
  --bg:#efe3c6;--pagebg:radial-gradient(120% 60% at 50% 0%,#f6edd4 0%,#eee1bf 55%,#e5d4a6 100%);
  --navy:#f6edd4;--navy-2:#e4d3a8;--royal:#dcc995;
  --gold:#a67a1c;--gold-soft:#7a560f;--silver:#2c4372;--ice:#16294f;--muted:#6a5f45;
  --line:rgba(22,41,79,.18);--card:#f6edd4;
  --hdr:rgba(240,228,200,.96);--hdrline:rgba(166,122,28,.5);
  --btn:#8f6614;--btn-ink:#fff6dc;--chip:#e4d3a8;--chip-h:#dcc995;--chipfg:#7a560f;
  --box:rgba(255,255,255,.5);--soft:rgba(255,255,255,.55);--ring:rgba(143,102,20,.65);
  --ic1:#f6ecd0;--ic2:#e2d0a3;--icfg:#7a560f;--trk:rgba(22,41,79,.16);
  --font-ui:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --font-label:'Cinzel','Trajan Pro',Georgia,serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#08142b;--pagebg:linear-gradient(135deg,#061024 0%,#08142b 35%,#0b2552 100%);
  --navy:#0b1b3a;--navy-2:#0f2a58;--royal:#0f3a7a;
  --gold:#d4a52a;--gold-soft:#e7c872;--silver:#c9cdd3;--ice:#eef1f6;--muted:#9aa6bd;
  --line:rgba(201,205,211,.16);--card:#0d2048;
  --hdr:rgba(8,20,43,.94);--hdrline:rgba(212,165,42,.3);
  --btn:#d4a52a;--btn-ink:#1a1405;--chip:#0f2a58;--chip-h:#0f3a7a;--chipfg:#e7c872;
  --box:rgba(13,32,72,.55);--soft:rgba(255,255,255,.07);--ring:rgba(212,165,42,.6);
  --ic1:#102f66;--ic2:#0b1b3a;--icfg:#e7c872;--trk:rgba(255,255,255,.12);
  color-scheme:dark;
}
/* Cartões, vídeos, destaque e janela de vídeo mantêm fundo azul-escuro nos dois temas */
.tile,.frame,.spot,.overlay{--navy:#0b1b3a;--navy-2:#0f2a58;--royal:#0f3a7a;--gold:#d4a52a;--gold-soft:#e7c872;--silver:#c9cdd3;--ice:#eef1f6;--muted:#9aa6bd;--line:rgba(201,205,211,.16);color:#eef1f6}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;min-height:100%;color:var(--ice);font-family:var(--font-ui);font-size:16px;line-height:1.55;
  background-color:var(--bg);
  background-image:var(--pagebg);
  background-repeat:no-repeat;background-size:100% 100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:3px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding-block:12px}
.brand{text-decoration:none;display:flex;flex-direction:column;gap:3px;line-height:1}
.brand-name{font-weight:800;font-size:22px;letter-spacing:.03em;color:var(--silver)}
.brand-sub{font-family:var(--font-label);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-soft);border-top:1px solid var(--gold);padding-top:4px}
nav.menu{display:flex;flex-wrap:wrap;gap:4px 18px;margin-left:auto}
nav.menu a{font-size:14px;font-weight:500;text-decoration:none;color:var(--silver);padding:6px 0;border-bottom:2px solid transparent}
nav.menu a:hover{color:var(--ice)}
nav.menu a[aria-current="page"]{color:var(--gold-soft);border-bottom-color:var(--gold)}
.search{position:relative;flex:1 1 260px;max-width:420px;order:3}
.search input{width:100%;font:inherit;font-size:15px;color:var(--ice);background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:10px 14px 10px 40px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--navy);border:1px solid var(--line);border-radius:4px;box-shadow:0 18px 40px rgba(0,0,0,.45);padding:6px;max-height:60vh;overflow:auto;z-index:40}
.results a,.results p{display:block;padding:9px 10px;border-radius:3px;text-decoration:none;font-size:15px;margin:0}
.results a:hover,.results a:focus{background:rgba(212,165,42,.14)}
.results small{display:block;color:var(--muted);font-size:12px}
.results p{color:var(--muted)}

/* Títulos */
main{padding-block:32px 72px}
.eyebrow{font-family:var(--font-label);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-soft);margin:0 0 10px}
h1{font-weight:800;font-size:clamp(30px,5.6vw,52px);line-height:1.05;margin:0 0 16px;letter-spacing:-.01em;text-wrap:balance}
h2{font-weight:700;font-size:clamp(21px,3vw,28px);line-height:1.15;margin:0 0 6px;text-wrap:balance}
h3{font-weight:700;font-size:17px;margin:0 0 6px}
.lead{font-family:var(--font-serif);font-size:clamp(17px,2.2vw,20px);line-height:1.6;color:var(--silver);max-width:62ch;margin:0}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),rgba(212,165,42,0) 70%);border:0;margin:0 0 22px;width:100%}
.section{margin-top:56px}
.section-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:6px}
.section-head p{margin:0;color:var(--muted);font-size:14px}
.crumb{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:14px;color:var(--muted);margin-bottom:22px}
.crumb a{color:var(--gold-soft);text-decoration:none}
.crumb a:hover{text-decoration:underline}

/* Botões */
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;border-radius:4px;padding:11px 20px;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink)}
.btn:hover{background:var(--gold-soft);border-color:var(--gold-soft);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--gold-soft);border-color:var(--gold)}
.btn.ghost:hover{background:var(--chip);color:var(--gold-soft);border-color:var(--gold)}
.btn.small{padding:8px 14px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}

/* Hero */
.hero{padding-block:20px 8px}
.search.hero-search{max-width:620px;flex:none;order:0;margin-bottom:18px}
.hero-search input{font-size:17px;padding:14px 16px 14px 46px}
.hero-search svg{left:16px;width:18px;height:18px}

/* Grades e cartões quadrados */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.tile{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-width:0;aspect-ratio:1/1;padding:14px;text-decoration:none;border-radius:4px;border:1px solid var(--line);background:linear-gradient(160deg,var(--navy-2),var(--navy) 70%);overflow:hidden;transition:border-color .15s,transform .15s}
.tile.land{aspect-ratio:16/9}
.tile:hover{border-color:var(--gold);transform:translateY(-2px)}
.tile .play{position:absolute;left:14px;top:14px;width:34px;height:34px;border-radius:50%;background:rgba(212,165,42,.16);border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold-soft)}
.tile .play svg{width:13px;height:13px;margin-left:2px}
.tile .name{font-weight:700;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.tile .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.tile.theme{aspect-ratio:auto;min-height:75px;padding:10px 14px;background:linear-gradient(160deg,#102f66,var(--navy) 80%)}
.tile.theme .name{font-size:18px}
.tile.theme .sub{font-size:12px;margin-top:1px}
.tile.theme::after{content:"";position:absolute;right:-16px;top:-16px;width:50px;height:50px;border:1px solid rgba(212,165,42,.35);transform:rotate(45deg)}
.flag{position:absolute;top:12px;right:12px;width:36px;height:24px;border-radius:2px;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.04em;color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.35)}

/* Players */
.frame{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;border-radius:4px;border:1px solid var(--line);background:radial-gradient(120% 120% at 20% 10%,#12336f,#060f23 70%);display:grid;place-items:center;text-align:center;padding:16px;overflow:hidden}
.frame .chip{position:absolute;left:12px;top:12px;font-family:var(--font-label);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-soft);background:rgba(8,20,43,.8);border:1px solid var(--line);padding:5px 9px;border-radius:3px}
.frame .big{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold-soft);margin:0 auto 12px}
.frame .big svg{width:24px;height:24px;margin-left:4px}
.frame p{margin:0;color:var(--silver);font-size:14px;max-width:34ch}
.frame a{color:var(--gold-soft)}
.cap{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin:0 0 10px}
.cap .n{font-family:var(--font-label);color:var(--gold-soft);font-size:15px;letter-spacing:.14em}
.stack{display:grid;gap:30px}
.player-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:var(--box)}
.player-bar button{font:inherit;cursor:pointer;color:var(--ice);background:transparent;border:1px solid var(--line);border-radius:4px;padding:8px 12px;font-size:14px}
.player-bar button:hover{border-color:var(--gold)}
.player-bar .go{background:var(--btn);border-color:var(--btn);color:var(--btn-ink);font-weight:700;min-width:96px}
.track{flex:1 1 160px;height:6px;background:var(--trk);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--gold)}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

/* Texto do sinal */
.solo{max-width:900px}
.grid.letters{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}
.tile.letter{align-items:center;justify-content:center;padding:0}
.ltr{font-family:var(--font-label);font-size:34px;font-weight:600;color:var(--gold-soft)}
.sign-cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px;align-items:start}
.defs{display:grid;gap:22px}
.defs h3{font-family:var(--font-label);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--gold-soft);margin-bottom:8px}
.defs p{font-family:var(--font-serif);font-size:18px;line-height:1.65;color:var(--silver);margin:0}
.badge{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:2px 8px;margin-left:8px;vertical-align:middle;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;padding:0;list-style:none}
.tags a{font-size:13px;text-decoration:none;color:var(--gold-soft);border:1px solid rgba(212,165,42,.45);padding:3px 10px;border-radius:3px}
.tags a:hover{background:rgba(212,165,42,.14)}

/* Comentários */
.comments{border-top:1px solid var(--line);padding-top:26px}
.form{display:grid;gap:12px;max-width:640px;margin:16px 0 26px}
.form input[type=text],.form textarea{font:inherit;font-size:15px;color:var(--ice);background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%}
.form textarea{min-height:92px;resize:vertical}
.form label{font-size:13px;color:var(--muted)}
.form .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.status{font-size:13.5px;color:var(--gold-soft);margin:0;min-height:1.2em}
.clist{list-style:none;margin:0;padding:0;display:grid;gap:14px;max-width:720px}
.clist li{padding:14px 16px;border:1px solid var(--line);border-radius:4px;background:var(--box)}
.clist b{font-size:14px}
.clist span{color:var(--muted);font-size:12.5px;margin-left:8px}
.clist p{margin:6px 0 0;font-family:var(--font-serif);font-size:16.5px;color:var(--silver);overflow-wrap:anywhere}

/* Lista da Patrística */
.plist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.plist a{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:14px;text-decoration:none;padding:14px 16px;border:1px solid var(--line);border-radius:4px;background:var(--box)}
.plist a:hover{border-color:var(--gold)}
.plist .num{font-family:var(--font-label);font-size:18px;color:var(--gold-soft)}
.plist .t{font-weight:700;overflow-wrap:anywhere}
.plist .go{font-size:13px;color:var(--gold-soft)}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.feature{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.feature .tile{aspect-ratio:auto;min-height:170px}
.feature .tile .name{font-size:22px}
.feature .tile .sub{font-size:14px}
footer.foot{border-top:1px solid var(--line);padding-block:22px 34px;color:var(--muted);font-size:13px}

@media (max-width:760px){
  .sign-cols{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}

/* Cartões de vídeo menores: grandes só ao abrir para assistir */
.grid.compact{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.grid.compact .tile{padding:8px}
.grid.compact .tile .play{left:8px;top:8px;width:20px;height:20px}
.grid.compact .tile .play svg{width:8px;height:8px;margin-left:1px}
.grid.compact .tile .name{font-size:12.5px;line-height:1.2}
.grid.thumbs{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.grid.thumbs .tile{padding:8px}
.grid.thumbs .tile .play{left:8px;top:8px;width:20px;height:20px}
.grid.thumbs .tile .play svg{width:8px;height:8px;margin-left:1px}
.grid.thumbs .tile .name{font-size:12.5px;line-height:1.2}
.grid.thumbs .tile .sub{display:none}

/* Tela dos dois vídeos: a página rola, os controles ficam embaixo e não tiram área dos vídeos */
body.watch main{max-width:none;padding-block:12px 48px}
.dual{container-type:inline-size}
/* Vertical: original e intérprete, um embaixo do outro, na mesma largura (100%) */
.pair{display:flex;flex-direction:column;align-items:center;gap:10px}
.pair .frame{padding:6px}
.pair .frame.orig,.pair .frame.terp{width:100%;height:auto;aspect-ratio:16/9}
.dualpage .player-bar{margin-top:14px}
/* Horizontal: composição centralizada e preenchendo a largura. Original com 77% da tela; a faixa do intérprete (terço central, 16:27) ao lado, na mesma altura, sobrepondo 4% da largura do original */
.ctl-home{display:none}
@media (min-aspect-ratio:1/1){
  /* sem cabeçalho nem margens: o botão início passa para a barra de controles e a composição usa o máximo da tela */
  body.watch .top{display:none}
  body.watch main.wrap{padding-top:0;padding-bottom:36px;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .ctl-home{display:inline-flex}
  .dualpage .player-bar{margin-left:max(10px,env(safe-area-inset-left,0px));margin-right:max(10px,env(safe-area-inset-right,0px))}
  .pair{display:block;position:relative;width:min(100%,calc(100dvh / 0.43493));margin-inline:auto;aspect-ratio:1 / 0.43493}
  .pair .frame.orig{position:absolute;left:0;top:0;width:77.32%}
  .pair .frame.terp{position:absolute;left:74.22%;top:0;height:100%;width:auto;aspect-ratio:16/27;z-index:2;box-shadow:0 12px 32px rgba(0,0,0,.55)}
  .pair .frame.terp .chip{font-size:8px;letter-spacing:.08em;left:6px;top:6px;padding:3px 6px}
}

/* Capas dos cartões quadrados: o título fica sobre um degradê escuro */
.tile.cov .cover{position:absolute;inset:0;z-index:0;transform:scale(var(--z,1));transform-origin:var(--x,50%) var(--y,50%);background-position:var(--x,50%) var(--y,50%);background-repeat:no-repeat}
.tile.theme.cov::before{height:100%;background:linear-gradient(to right,rgba(88,60,10,.95) 0%,rgba(112,80,18,.78) 48%,rgba(112,80,18,0) 100%)}
.tile.theme.cov::after{display:none}
.tile.cov::before{content:"";position:absolute;left:0;right:0;bottom:0;height:66%;background:linear-gradient(to top,rgba(88,60,10,.96) 0%,rgba(112,80,18,.8) 42%,rgba(112,80,18,0) 100%);z-index:1;pointer-events:none}
.tile.cov .name,.tile.cov .sub{position:relative;z-index:2}
.tile.cov .play,.tile.cov .flag{z-index:2}
.tile.cov .play{background:rgba(8,20,43,.6)}
.grid.compact.roomy{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}

/* Destaques girando */
.spot{position:relative;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:100%;max-width:100%;height:clamp(200px,30vw,340px);background:var(--navy)}
.spot .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:22px 22px 26px;text-decoration:none;opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s;background:linear-gradient(160deg,#143a80,#0b1b3a 75%)}
.spot .slide:nth-child(2){background:linear-gradient(200deg,#0f2a58,#08142b 80%)}
.spot .slide:nth-child(3){background:linear-gradient(120deg,#1a3f7a,#0a1f44 70%)}
.spot .slide.on{opacity:1;visibility:visible;z-index:1}
.spot .slide .play{position:absolute;left:22px;top:22px;width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold-soft)}
.spot .slide .play svg{width:16px;height:16px;margin-left:3px}
.spot .slide .name{font-weight:800;font-size:clamp(20px,3.4vw,32px);line-height:1.1;text-wrap:balance}
.spot .slide .sub{font-size:13.5px;color:var(--muted)}
.dots{position:absolute;right:16px;bottom:12px;z-index:2;display:flex;gap:8px}
.dots button{width:12px;height:12px;padding:0;border-radius:50%;border:1px solid var(--gold);background:transparent;cursor:pointer}
.dots button[aria-current="true"]{background:var(--gold)}
@media (prefers-reduced-motion:reduce){.spot .slide{transition:none}}

/* Reprodutor dentro do site */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(3,8,20,.92);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.vbox{width:min(100%,calc((100dvh - 120px) * 16 / 9),1100px)}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.vtitle{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.vclose{font:inherit;font-size:24px;line-height:1;width:40px;height:40px;flex:none;cursor:pointer;color:var(--ice);background:transparent;border:1px solid var(--line);border-radius:4px}
.vclose:hover{border-color:var(--gold)}
.grid.compact .tile .sub{display:none}

[hidden]{display:none!important}
/* Logo, rodapé, transições e detalhes dourados */
.brand{display:block}
.brand img{display:block;height:54px;width:auto;max-width:78vw}
@media (min-width:700px){.brand img{height:64px}}
.top{border-bottom:1px solid var(--hdrline)}
.tile:hover{box-shadow:0 0 0 1px var(--gold),0 12px 26px rgba(0,0,0,.4)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#app>*{animation:fadein .35s ease both}
@media (prefers-reduced-motion:reduce){#app>*{animation:none}}
body.watch footer.foot{display:none}
footer.foot{margin-top:24px}
.foot-in{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px 28px}
.foot-in a:not(.btn){color:var(--silver);text-decoration:none;font-size:14px;border-bottom:1px solid var(--gold)}
.newtag{position:absolute;top:8px;right:8px;z-index:3;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#1a1405;background:var(--gold);padding:2px 6px;border-radius:2px}

/* Controles do vídeo: velocidade, repetir e compartilhar */
.vctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;max-width:900px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{font:inherit;font-size:13px;color:var(--silver);background:transparent;border:0;padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);font-weight:700}
.tog{font:inherit;font-size:13px;cursor:pointer;color:var(--silver);background:transparent;border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.tog[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-soft)}
.player-bar .seg button{border:0;border-radius:0}
.linkbtn{font:inherit;font-size:12.5px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:4px}
.player-bar .linkbtn{border:0;padding:4px}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:18px;max-width:900px}
.pn>*{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:1px solid var(--line);border-radius:4px;text-decoration:none;background:var(--box)}
.pn a:hover{border-color:var(--gold)}
.pn small{color:var(--muted);font-size:12px}
.pn b{font-size:15px;overflow-wrap:anywhere}
.pn .nx{text-align:right}
.pn .off{visibility:hidden}

/* Página Sobre */
.about p{font-family:var(--font-serif);font-size:18px;line-height:1.65;color:var(--silver);max-width:64ch;margin:0 0 14px}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:22px 14px}
.member{text-align:center;min-width:0}
.pw{display:block;position:relative;width:104px;height:104px;margin:0 auto 10px;color:inherit}
.pw .photo{margin:0}
.igb{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--chipfg);border:1px solid var(--gold)}
.igb svg{width:16px;height:16px}
a.pw:hover .photo{border-color:var(--gold)}
.subhead{font-size:16px;font-weight:700;color:var(--gold-soft);letter-spacing:.06em;text-transform:uppercase;margin:34px 0 16px}
.photo{position:relative;width:104px;height:104px;margin:0 auto 10px;border-radius:50%;overflow:hidden;display:grid;place-items:center;border:1px solid var(--ring);background:linear-gradient(160deg,var(--ic1),var(--ic2));color:var(--icfg)}
.photo svg{width:46px;height:46px}
.who{font-weight:700;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.role{display:inline-block;margin-top:6px;font-size:12px;border:1px solid var(--line);border-radius:3px;padding:2px 9px}
.role.surdo{color:var(--gold-soft);border-color:rgba(212,165,42,.6)}
.role.ouvinte{color:var(--silver)}

/* Vídeos de outros estados e países: cartões menores */
.grid.small{grid-template-columns:repeat(auto-fill,84px);gap:10px}
.grid.small .tile{padding:8px}
.grid.small .play{left:8px;top:8px;width:20px;height:20px}
.grid.small .play svg{width:8px;height:8px;margin-left:1px}
.grid.small .name{font-size:11.5px;line-height:1.15}
.grid.small .sub{display:none}
.grid.small .flag{top:8px;right:8px;width:28px;height:19px;font-size:8px}

/* ===== Site real: players do YouTube ===== */
.frame.live{padding:0;border:0;display:block;background:#000}
.pair .frame.live{padding:0}
.yt,.poster{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.terp .yt,.terp .poster{left:0;width:100%}
.terp .yt{pointer-events:none}
@media (min-aspect-ratio:1/1){.terp .yt,.terp .poster{left:-100%;width:300%}}
.poster{background:#000 center/cover no-repeat;cursor:pointer;border:0;padding:0}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.poster .big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;background:rgba(8,20,43,.65)}
.frame.live .chip{z-index:3;pointer-events:none}
.tile.cov .cover.img{background-size:cover}
.cover .cimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--x,50%) var(--y,50%);display:block}
.tile.soon{cursor:default;pointer-events:none}
.tile.soon .cover{filter:saturate(.35) brightness(.7)}
.tile.soon .name{opacity:.8}
.soontag{position:absolute;top:8px;left:8px;z-index:3;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--silver);background:rgba(8,20,43,.75);border:1px solid var(--line);border-radius:3px;padding:2px 6px}
.results .soonres{display:block;padding:10px 14px;color:var(--muted)}
.results .soonres small{display:block;font-size:12px}
.msg{padding:18px;color:var(--silver);font-size:15px}
.cform-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.clist video{max-width:100%;border-radius:4px;margin-top:8px}

/* Botão do WhatsApp: ícone amarelo em botão azul */
.btn.wa{background:var(--chip);border:1px solid var(--gold);padding:7px 12px;color:var(--chipfg)}
.btn.wa:hover{background:var(--chip-h);color:var(--chipfg)}
.btn.wa svg{width:22px;height:22px;display:block;fill:var(--chipfg)}
.pn small,.pn b{white-space:normal}
.pn .ar{font-family:'Source Serif 4',serif;letter-spacing:.02em}
/* Sinal na horizontal: cabeçalho não fica fixo e o vídeo cabe na altura da tela */
@media (min-aspect-ratio:1/1){
  .top{position:static}
  .solo{max-width:min(900px,calc((100dvh - 64px) * 16 / 9))}
  .vctl,.pn{max-width:min(900px,calc((100dvh - 64px) * 16 / 9))}
}
@media (min-aspect-ratio:1/1){
  body.solopage .top{display:none}
  body.solopage main.wrap{padding-top:10px}
  .sp{display:flex;flex-direction:column}
  .sp .solo{order:-1}
}
@media (min-aspect-ratio:1/1) and (max-height:620px){
  .brand img{height:38px}
  .top .wrap{padding-block:6px}
  .top .menu{margin-top:0}
}
/* Mais vídeos */
.morewrap{display:flex;justify-content:center;margin-top:18px}
.morebtn{width:52px;height:52px;padding:0;justify-content:center;font-size:28px;line-height:1;font-weight:400;background:var(--chip);color:var(--chipfg);border:1px solid var(--gold);border-radius:50%;cursor:pointer;font-family:var(--font-ui)}
.morebtn:hover{background:var(--chip-h)}
/* Instalar na tela inicial */
.instbar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:50;max-width:520px;margin-inline:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;background:var(--chip);border:1px solid var(--gold);border-radius:6px;box-shadow:0 12px 32px rgba(0,0,0,.5);font-size:14.5px}
.instbar p{margin:0;flex:1 1 220px;color:var(--ice)}
.instbar .row{display:flex;gap:8px}
.dualpage .player-bar .btn{white-space:nowrap}
.frame.soonbox{display:grid;place-items:center;background:radial-gradient(120% 120% at 20% 10%,#12336f,#060f23 70%);border:1px solid var(--line)}
.frame.soonbox span{text-align:center;line-height:1.5;padding:0 14px;text-wrap:balance;font-family:var(--font-label);letter-spacing:.18em;text-transform:uppercase;font-size:14px;color:var(--gold-soft)}
.entidades{display:flex;flex-wrap:wrap;gap:24px 32px;margin-top:36px;padding-top:22px;border-top:1px solid var(--line)}
.entidade{display:flex;flex-direction:column;gap:8px}
.entidade .ent-t{margin:0;font-family:var(--font-label);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.entidade .ent-box{background:#fff;border-radius:4px;padding:8px 14px;display:inline-flex;align-items:center}
.entidade .ent-box{width:200px;height:76px;padding:8px 14px;display:flex;align-items:center;justify-content:center}
.entidade a{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.entidade img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;margin:0 auto}
.entidade a{display:inline-flex}
.contato{display:flex;flex-wrap:wrap;gap:28px 48px;margin-top:26px}
.contato-item h2{font-size:18px;margin:0 0 12px;font-weight:700}
.btn.wa.contato-ic{width:72px;height:72px;padding:0;justify-content:center}
.btn.wa.contato-ic svg{width:38px;height:38px}

/* WhatsApp sempre à direita; os demais controles ficam à esquerda */
.vctl .wa,.player-bar .wa{margin-left:auto}

/* Início: carrossel de destaque entre os botões e "Últimos vídeos" */
.section.spotsec{margin-top:28px}

/* Recomendamos: canais do YouTube em círculos que rolam para o lado */
.recrow{display:flex;gap:18px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;padding:4px 2px 14px;margin:0 -2px;scrollbar-width:thin;scrollbar-color:rgba(212,165,42,.5) transparent}
.recrow::-webkit-scrollbar{height:6px}
.recrow::-webkit-scrollbar-thumb{background:rgba(212,165,42,.5);border-radius:3px}
.rec{flex:0 0 92px;width:92px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;text-decoration:none;scroll-snap-align:start;min-width:0}
.rec .rimg{position:relative;width:84px;height:84px;border-radius:50%;overflow:hidden;display:grid;place-items:center;border:1px solid var(--ring);background:linear-gradient(160deg,var(--ic1),var(--ic2));color:var(--icfg);font-family:var(--font-label);font-size:30px;font-weight:600;transition:border-color .15s,transform .15s,box-shadow .15s}
.rec .rimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.rec:hover .rimg{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 0 0 1px var(--gold),0 10px 22px rgba(0,0,0,.4)}
.rec .rname{font-size:13px;line-height:1.2;font-weight:600;color:var(--silver);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
@media (prefers-reduced-motion:reduce){.rec .rimg{transition:none}.rec:hover .rimg{transform:none}}

/* ===== Tema, cabeçalho e tela inicial novos ===== */
.brand .logo-d{display:none}
:root[data-theme="dark"] .brand .logo-d{display:block}
:root[data-theme="dark"] .brand .logo-l{display:none}
.top .wrap.hrow{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:10px;padding-block:8px;position:relative}
.top .brand{flex:1 1 auto;min-width:0;display:block;text-align:left}
.top .brand img{height:40px;width:auto;max-width:100%;object-fit:contain;object-position:left center}
.rb{display:flex;gap:8px;flex:none;margin-left:auto}
.ib{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;background:transparent;color:var(--gold-soft);cursor:pointer;padding:0;font:inherit}
.ib svg{width:18px;height:18px}
.ib:hover{background:var(--chip)}
.top .search.sfield{display:none;position:static;flex:1 1 auto;min-width:0;max-width:none;order:0;width:auto}
.top.sopen .search.sfield{display:block}
.top.sopen .brand{display:none}
.sbox{position:relative}
.top .navrow{padding-block:0 8px;justify-content:center}
body.home main{padding-block:14px 72px}
.hero{padding-block:4px 0}
nav.menu{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:center;margin:0}
.results a{display:flex;align-items:center;gap:10px}
.results a>span{min-width:0;flex:1}
.rth{flex:none;width:56px;height:32px;object-fit:cover;border-radius:3px;background:var(--navy-2)}
/* Endereço da página */
.crumbs{margin:0 0 16px}
.crumbs ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 0;font-size:13px;color:var(--muted)}
.crumbs li+li::before{content:"\203A";margin:0 7px;color:var(--gold)}
.crumbs a{color:var(--gold-soft);text-decoration:none;padding:4px 0}
.crumbs a:hover{text-decoration:underline}
.crumbs li[aria-current]{color:var(--ice);font-weight:600;overflow-wrap:anywhere}
@media (min-aspect-ratio:1/1){body.watch .crumbs{display:none}}
/* Início: faixa de ícones */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:560px;margin:4px auto 0}
.ci{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;line-height:1.2;color:var(--silver);font-weight:500;text-decoration:none}
.ci i{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ring);background:linear-gradient(160deg,var(--ic1),var(--ic2));color:var(--icfg);transition:box-shadow .2s}
.ci:hover i{box-shadow:0 0 0 1px var(--gold)}
.ci i.p{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.ci svg{width:28px;height:28px}
.cut{fill:var(--ic2)}
button.tile{font:inherit;cursor:pointer}
.tile.plus{align-items:center;justify-content:center;background:var(--chip);border:1px solid var(--gold);color:var(--chipfg);font-size:40px;font-weight:400;line-height:1;font-family:var(--font-ui)}
.tile.plus::before{display:none}
.tile.plus:hover{background:var(--chip-h)}
#recent{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#recent .tile{padding:8px}
#recent .tile .name{font-size:12.5px}
#recent .tile.plus{font-size:34px}
@media (min-width:1000px){#recent{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tg{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--gold);padding:0;border-radius:50%!important;border-radius:4px;background:transparent;font:inherit;font-size:14px;color:var(--silver);cursor:pointer}
.tg:hover{border-color:var(--gold)}
.tg svg{width:18px;height:18px;color:var(--gold-soft)}
/* Capa com zoom suave ao passar o dedo ou o mouse */
.tile.cov .cover{transition:transform .35s ease}
.tile.cov:hover .cover,.tile.cov:active .cover{transform:scale(calc(var(--z,1) * 1.07))}
.tile.soon:hover .cover{transform:scale(var(--z,1))}
/* Alfabeto numa só tela */
.letters.fit{--g:8px;display:grid;grid-template-columns:repeat(var(--c,4),var(--s,64px));grid-auto-rows:var(--s,64px);gap:var(--g);justify-content:center;align-content:start}
.lt{display:grid;place-items:center;border-radius:5px;border:1px solid var(--gold);background:linear-gradient(160deg,#102f66,#0b1b3a 80%);color:#e7c872;font-family:var(--font-label);font-weight:600;text-decoration:none;font-size:calc(var(--s,64px) * .5);min-width:0}
.lt:hover{box-shadow:0 0 0 1px var(--gold)}
.lt.tema{background:var(--btn);border-color:var(--btn);color:var(--btn-ink);font-family:var(--font-ui);font-weight:800;font-size:calc(var(--s,64px) * .3);text-align:center;line-height:1.1;grid-column:-3 / -1;grid-row:var(--r,7)}
body.letras main{padding-bottom:14px}
@media (min-aspect-ratio:1/1){body.letras .top,body.letras main h1,body.letras main .rule{display:none}body.letras main{padding-top:10px}}
body.letras footer.foot{margin-top:6px}
/* Carregando (esqueleto) e sem conexão */
.skel{padding-top:8px}
.sk{display:block;border-radius:4px;background:linear-gradient(90deg,var(--chip) 0%,var(--chip-h) 50%,var(--chip) 100%);background-size:200% 100%;animation:shim 1.3s linear infinite}
.sk.h{height:26px;width:46%;margin-bottom:14px}
.skg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.skg .sk{aspect-ratio:1/1}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}.tile.cov .cover{transition:none}.tile.cov:hover .cover,.tile.cov:active .cover{transform:scale(var(--z,1))}}
.offline{max-width:420px;margin:48px auto;text-align:center;display:grid;gap:16px;justify-items:center}
.offline img{height:48px;width:auto;max-width:90%}
.offline p{margin:0;color:var(--silver);font-size:16px}
/* Dual Play: crédito, troca de tamanho e próximo automático */
.credit{margin:14px max(10px,env(safe-area-inset-left,0px)) 0;font-size:13px;color:var(--muted);max-width:760px}
.credit a{color:var(--gold-soft)}
.autonext{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:14px max(10px,env(safe-area-inset-left,0px)) 0;padding:10px 14px;border:1px solid var(--gold);border-radius:4px;background:var(--chip);color:var(--ice);font-size:14.5px}
.autonext p{margin:0;flex:1 1 200px}
.pair.swap .frame.orig{width:62%}
.pair.swap .frame.terp{order:-1}
@media (min-aspect-ratio:1/1){
  .pair.swap .frame.orig{left:auto;right:0;top:0;width:25.78%;z-index:2;box-shadow:0 12px 32px rgba(0,0,0,.55)}
  .pair.swap .frame.terp{left:0;top:0;height:auto;width:77.32%;aspect-ratio:16/9;z-index:1;box-shadow:none}
  .pair.swap .terp .yt,.pair.swap .terp .poster{left:0;width:100%}
}
</style>
</head>
